{% extends "base.html" %}

{% block title %}Interview Evaluator - CloseAI{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>🎤 Interview Evaluator</h1>
        <p>Evaluate interview responses using AI-powered analysis</p>
    </div>

    <div class="tool-container">
        <div class="form-section">
            <div class="form-group">
                <label for="question">Interview Question</label>
                <textarea id="question" rows="3" placeholder="Enter the interview question..."></textarea>
            </div>

            <div class="form-group">
                <label for="answer">Candidate's Answer</label>
                <textarea id="answer" rows="6" placeholder="Enter the candidate's answer..."></textarea>
            </div>

            <button id="evaluateBtn" class="btn btn-primary btn-large">Evaluate Answer</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing response...</p>
        </div>

        <div id="results" class="results-section" style="display: none;">
            <h2>Evaluation Results</h2>
            <div id="resultsContent"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
{% endblock %}
