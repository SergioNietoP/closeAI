{% extends "base.html" %}

{% block title %}Text Analyzer - CloseAI{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>📝 Text Analyzer</h1>
        <p>Analyze text for sentiment, grammar, style, and content</p>
    </div>

    <div class="tool-container">
        <div class="form-section">
            <div class="form-group">
                <label for="text">Text to Analyze</label>
                <textarea id="text" rows="8" placeholder="Enter or paste your text here..."></textarea>
            </div>

            <div class="form-group">
                <label for="analysisType">Analysis Type</label>
                <select id="analysisType">
                    <option value="general">General Analysis</option>
                    <option value="sentiment">Sentiment Analysis</option>
                    <option value="grammar">Grammar Check</option>
                    <option value="summary">Summarization</option>
                </select>
            </div>

            <button id="analyzeBtn" class="btn btn-primary btn-large">Analyze Text</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing text...</p>
        </div>

        <div id="results" class="results-section" style="display: none;">
            <h2>Analysis Results</h2>
            <div id="resultsContent"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/analyzer.js') }}"></script>
{% endblock %}
